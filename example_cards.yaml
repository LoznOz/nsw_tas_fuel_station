type: grid
cards:
  - type: heading
    heading: Example Cards
    heading_style: title
  - type: tile
    grid_options:
      columns: 12
      rows: 1
    entity: sensor.home_cheapest_home_1
    name: Cheapest near home
    state_content:
      - station_name
      - fuel_type
      - state
      - last_updated
    vertical: false
    features_position: bottom
  - graph: none
    type: sensor
    entity: sensor.home_cheapest_home_2
    detail: 1
    name: Good price today
  - show_name: true
    show_icon: false
    show_state: true
    type: glance
    entities:
      - entity: sensor.hobart_ampol_foodary_sandy_bay_u91
        name: Ampol Sandy Bay
      - entity: sensor.hobart_ampol_hobart_macquarie_st_u91
        name: Ampol Macquarie St
      - entity: sensor.hobart_coles_express_hobart_u91
        name: Coles City
          - type: heading
            heading: Example Markdown
          - type: markdown
            content: >-
              Cheapest Diesel Great Western Highway

              # <ha-icon icon="mdi:gas-station-in-use"></ha-icon> {{
              states('sensor.great_western_highway_cheapest_great_western_highway_1')
              }} {{
              state_attr('sensor.great_western_highway_cheapest_great_western_highway_1',
              'unit_of_measurement') }}

              **{{
              state_attr('sensor.great_western_highway_cheapest_great_western_highway_1',
              'station_name') }}**

              Checked {{
              state_attr('sensor.great_western_highway_cheapest_great_western_highway_1',
              'price_last_checked') }} • Changed {{
              as_datetime(state_attr('sensor.great_western_highway_cheapest_great_western_highway_1',
              'price_last_changed')).strftime('%d %b %H:%M') }}
